# fly.toml app configuration file generated for db-thrumming-water-5938 on 2024-12-21T06:56:26-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'db-thrumming-water-5938'
primary_region = 'dfw'

[build]

[deploy]
release_command = "/bin/sh /migrate.sh"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

[mounts]
source = "data"
destination = "/data"
# Safety net: automatically grow the volume before it fills up, instead of
# failing writes. Triggers at 80% used, adds 2GB at a time, caps at 20GB.
# See https://fly.io/docs/reference/configuration/#auto-extend-volume-size-configuration
auto_extend_size_threshold = 80
auto_extend_size_increment = "2GB"
auto_extend_size_limit = "20GB"
